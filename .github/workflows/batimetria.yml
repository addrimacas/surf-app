name: Batimetría (EMODnet) por playa
on:
  workflow_dispatch:
    inputs:
      paso:
        description: 'perfiles | rayos'
        default: 'perfiles'
permissions: { contents: write }
jobs:
  batimetria:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy tifffile
      - if: inputs.paso != 'rayos'
        run: python scripts/batimetria/descargar_y_perfiles.py 2>&1 | tee registro/batimetria-log.txt; exit ${PIPESTATUS[0]}
        shell: bash
        continue-on-error: true
      - if: inputs.paso == 'rayos'
        run: python scripts/batimetria/trazar_rayos.py 2>&1 | tee registro/rayos-log.txt
      - if: always()
        run: |
          git config user.name "salitre-bot"; git config user.email "salitre-bot@users.noreply.github.com"
          git add registro/batimetria-log.txt registro/rayos-log.txt atlas-batimetria.js 2>/dev/null || true; git add data/batimetria-playas.json data/batimetria-galicia.npz 2>/dev/null || true
          git commit -m "batimetría EMODnet: malla de Galicia y perfiles por playa" || true
          git pull --rebase && git push
